appId: com.pockymoe.desktop
productName: Pockymoe
directories:
  buildResources: build
  output: release
files:
  - out/**
  - build/*.png
  - build/tray-*.ico
  - package.json
extraResources:
  - from: assets/pets
    to: pets
    filter: ['**/*']
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
protocols:
  name: Pockymoe
  schemes: [pockymoe, remotecodex]
publish:
  provider: github
  owner: dufangshi
  repo: pockymoe-app
