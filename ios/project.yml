name: RemoteCodex
options:
  bundleIdPrefix: com.remotecodex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    APS_ENVIRONMENT: development
  configs:
    Release:
      APS_ENVIRONMENT: production
targets:
  RemoteCodex:
    type: application
    platform: iOS
    sources:
      - path: Shell
        excludes: ["*.plist", "*.entitlements"]
      - path: Shared
      - path: ../web/pockymoe-host.js
        buildPhase: resources
      - path: RemoteCodex/Resources
    settings:
      base:
        INFOPLIST_FILE: Shell/Info.plist
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.remotecodex.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Pockymoe
      configs:
        Debug:
          INFOPLIST_FILE: Shell/Info-Debug.plist
    entitlements:
      path: Shell/RemoteCodex.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups: [group.com.remotecodex.app]
    dependencies:
      - target: PockymoeLiveActivity
  PockymoeLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
        excludes: ["*.plist", "*.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remotecodex.app.liveactivity
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: LiveActivity/Info.plist
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
    entitlements:
      path: LiveActivity/LiveActivity.entitlements
      properties:
        com.apple.security.application-groups: [group.com.remotecodex.app]
  RemoteCodexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RemoteCodexUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.remotecodex.app.uitests
        TEST_TARGET_NAME: RemoteCodex
    dependencies:
      - target: RemoteCodex
schemes:
  RemoteCodex:
    build:
      targets:
        RemoteCodex: all
        RemoteCodexUITests: [test]
    test:
      targets: [RemoteCodexUITests]
      gatherCoverageData: false
