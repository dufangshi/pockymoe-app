name: RemoteCodex
options:
  bundleIdPrefix: com.remotecodex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Build.xcconfig
  Release: Config/Build.xcconfig
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: $(POCKYMOE_DEVELOPMENT_TEAM)
    APS_ENVIRONMENT: development
  configs:
    Release:
      APS_ENVIRONMENT: production
targets:
  RemoteCodex:
    type: application
    platform: iOS
    sources:
      - path: Shell
        excludes: ["*.plist", "*.entitlements"]
      - path: Shared
      - path: ../web/pockymoe-host.js
        buildPhase: resources
      - path: ../web/ios-viewport.js
        buildPhase: resources
      - path: LiveActivity/Assets.xcassets
      - path: RemoteCodex/Resources
    preBuildScripts:
      - name: Configure app-bound hosts
        script: /usr/bin/python3 "$SRCROOT/../scripts/ios-app-bound-domains.py"
        inputFiles: ["$(SRCROOT)/Shell/Info.plist", "$(SRCROOT)/Shell/Info-Debug.plist"]
        outputFiles: ["$(DERIVED_FILE_DIR)/Shell-Info.plist"]
        basedOnDependencyAnalysis: false
    settings:
      base:
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/Shell-Info.plist
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: $(POCKYMOE_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Pockymoe
        CODE_SIGN_ENTITLEMENTS: $(POCKYMOE_APP_ENTITLEMENTS)
    dependencies:
      - target: PockymoeLiveActivity
  PockymoeLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
        excludes: ["*.plist", "*.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POCKYMOE_WIDGET_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: LiveActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(POCKYMOE_WIDGET_ENTITLEMENTS)
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
  RemoteCodexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RemoteCodexUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.remotecodex.app.uitests
        TEST_TARGET_NAME: RemoteCodex
    dependencies:
      - target: RemoteCodex
schemes:
  RemoteCodex:
    build:
      targets:
        RemoteCodex: all
        RemoteCodexUITests: [test]
    test:
      targets: [RemoteCodexUITests]
      gatherCoverageData: false
