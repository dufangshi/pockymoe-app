name: Desktop Windows parity
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/desktop-fixture/**'
      - '.github/workflows/desktop-windows.yml'
      - 'scripts/check-production-address.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scale: ['1', '1.5']
        locale: ['en-US', 'zh-CN']
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    env:
      POCKYMOE_TEST_SYSTEM_LOCALE: ${{ matrix.locale }}
      POCKYMOE_REAL_WEB: '1'
      PYTHONUTF8: '1'
      DESKTOP_E2E_RELEASE_WEB: '1'
      DESKTOP_E2E_BIN: ${{ github.workspace }}/.local/desktop-runtime-v0.13.44/remote-codex-win32-x64-msvc-cli.exe
      DESKTOP_E2E_WEB_DIST: ${{ github.workspace }}/.local/desktop-web-source/pockymoe/apps/supervisor-web/dist
      POCKYMOE_DESKTOP_SCALE: ${{ matrix.scale }}
      POCKYMOE_DESKTOP_EVIDENCE: ${{ github.workspace }}/desktop/evidence/scale-${{ matrix.scale }}
      POCKYMOE_PACKAGED_EXECUTABLE: ${{ github.workspace }}/desktop/release/win-unpacked/Pockymoe.exe
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      POCKYMOE_VOICE_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          New-Item -ItemType Directory -Force $env:POCKYMOE_DESKTOP_EVIDENCE | Out-Null
          pnpm install --frozen-lockfile 2>&1 | Tee-Object "$env:POCKYMOE_DESKTOP_EVIDENCE/install.log"
          exit $LASTEXITCODE
      - name: Typecheck and unit tests
        run: |
          pnpm typecheck 2>&1 | Tee-Object "$env:POCKYMOE_DESKTOP_EVIDENCE/typecheck.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm vitest run 2>&1 | Tee-Object "$env:POCKYMOE_DESKTOP_EVIDENCE/unit.log"
          exit $LASTEXITCODE
      - name: Build unpacked x64 app
        run: |
          pnpm build 2>&1 | Tee-Object "$env:POCKYMOE_DESKTOP_EVIDENCE/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --win --x64 --dir --publish never 2>&1 | Tee-Object "$env:POCKYMOE_DESKTOP_EVIDENCE/package.log"
          exit $LASTEXITCODE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard packaged app contents
        run: |
          node scripts/extract-asar.cjs release/win-unpacked/resources/app.asar release/scan-asar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../scripts/check-production-address.py release/scan-asar release/win-unpacked/resources/app.asar release/win-unpacked/resources/app.asar.unpacked out
          exit $LASTEXITCODE
      - name: Build pinned public Web and start isolated release runtime
        run: |
          pnpm exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../scripts/desktop-fixture/prepare-release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../scripts/desktop-fixture/prepare-web.py 2>&1 | Tee-Object "$env:POCKYMOE_DESKTOP_EVIDENCE/web-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../scripts/desktop-fixture/backend.py start 2>&1 | Tee-Object "$env:POCKYMOE_DESKTOP_EVIDENCE/backend.log"
          exit $LASTEXITCODE
      - name: Electron suites and Windows surface matrix
        run: |
          pnpm exec playwright test --project=electron --reporter=list 2>&1 | Tee-Object "$env:POCKYMOE_DESKTOP_EVIDENCE/electron.log"
          exit $LASTEXITCODE
      - name: Build six-surface contact sheets from original captures
        if: always()
        run: node scripts/contact-sheets.mjs "$env:POCKYMOE_DESKTOP_EVIDENCE"
      - name: Stop only the recorded disposable backend
        if: always()
        run: python ../scripts/desktop-fixture/backend.py stop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-windows-x64-scale-${{ matrix.scale }}-${{ matrix.locale }}
          path: desktop/evidence/
          if-no-files-found: warn
