name: Native iOS (simulator build and launch)
# The Expo/React Native client in native/: generate the iOS project (CNG), build it for the
# iOS Simulator (Debug and Release, signed ad hoc with simulator keychain entitlements), and
# check that the Release app launches and stays up. Screen-by-screen iOS testing happens on the
# x86sim lab with these .app artifacts; no device signing, no release.
on:
  push:
    branches: [feat/native-mobile]
    paths:
      - 'native/**'
      - '.github/workflows/native-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_NO_GIT_STATUS: '1'
  CI: '1'
  # Expo SDK 58's Swift (expo-modules-jsi: nonisolated(unsafe) locals, Swift runtime export
  # notes for Xcode 26.4/27) needs Xcode 26.4 or later; empty picks the newest stable one.
  XCODE_VERSION: ''
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.configuration }} build${{ matrix.configuration == 'Release' && ', launch' || '' }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=/Applications/Xcode_${XCODE_VERSION:-none}.app
          test -d "$XCODE" || XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit
          npx vitest run
      - name: Generate the iOS project (development variant, com.pockymoe.app.dev)
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: native/ios
        run: pod install
      - name: Build for the iOS Simulator
        run: |
          mkdir -p ../ci-out
          xcodebuild -workspace ios/PockymoeDev.xcworkspace -scheme PockymoeDev \
            -configuration ${{ matrix.configuration }} -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build > ../ci-out/xcodebuild.log 2>&1 || status=$?
          grep -E " error:|\*\* BUILD" ../ci-out/xcodebuild.log | head -40 || true
          [ -z "${status:-}" ] || { tail -40 ../ci-out/xcodebuild.log; exit "$status"; }
          test -f ios/build/Build/Products/${{ matrix.configuration }}-iphonesimulator/PockymoeDev.app/Info.plist
          # D1: an unsigned simulator app has no entitlements, so the Keychain refuses it (-34018).
          # Sign it ad hoc with the simulator keychain entitlements, as "Sign to Run Locally" does.
          APP=ios/build/Build/Products/${{ matrix.configuration }}-iphonesimulator/PockymoeDev.app
          codesign --force --deep --sign - "$APP"
          codesign --force --sign - --entitlements scripts/ci/simulator.entitlements --generate-entitlement-der "$APP"
          codesign -d --entitlements - "$APP" | head -20
          ditto -c -k --keepParent "$APP" ../ci-out/PockymoeDev-${{ matrix.configuration }}.app.zip
      - name: Launch smoke test on an iPhone simulator
        if: matrix.configuration == 'Release'
        run: |
          APP=ios/build/Build/Products/Release-iphonesimulator/PockymoeDev.app
          OUT="$PWD/../ci-out/smoke"; mkdir -p "$OUT"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; ds=[d for k,v in json.load(sys.stdin)['devices'].items() if 'iOS' in k for d in v if d['name'].startswith('iPhone')]; print(ds[-1]['udid'])")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.pockymoe.app.dev
          sleep 25
          xcrun simctl io "$UDID" screenshot "$OUT/launch.png"
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "PockymoeDev"' > "$OUT/device.log" 2>&1 || true
          # Still running after 25 s, and no Keychain entitlement errors (-34018).
          xcrun simctl spawn "$UDID" launchctl list | grep -q "com.pockymoe.app.dev" || { echo "the app is not running"; exit 1; }
          if grep -q -- "-34018" "$OUT/device.log"; then echo "Keychain entitlement errors"; grep -m3 -- "-34018" "$OUT/device.log"; exit 1; fi
          echo "launched and running"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-${{ matrix.configuration }}
          path: ci-out/
          if-no-files-found: warn
