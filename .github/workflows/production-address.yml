name: Production address guard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tracked-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-production-address.py
